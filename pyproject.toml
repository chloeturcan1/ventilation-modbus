[project]
name = "ventilation-modbus"
version = "0.1.0"
description = "Automate de ventilation simule, expose en Modbus TCP avec pymodbus"
requires-python = ">=3.13"
dependencies = [
    "pymodbus>=3.15.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ventilation_modbus"
